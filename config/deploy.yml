# Name of your application. Used to uniquely configure containers.
service: hardhat-example-ordersapp

# Name of the container image.
image: bongani-m/hardhat-example-ordersapp

# No production server or public hostname is known for this app.
# 192.168.0.1 and app.example.com are still the Kamal init placeholders.
servers:
  web:
    - 174.138.44.8
  worker:
    hosts:
      - 174.138.44.8
    cmd: worker
    proxy: false

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
proxy:
  ssl: true
  host: ordersapp.gearlog.io
  # The image listens on 8080. Kamal's proxy connects to port 80 by default.
  # Health checks use the proxy default, GET /up.
  app_port: 8080

# Credentials for your image host.
registry:
  server: registry.digitalocean.com
  username:
    - KAMAL_REGISTRY_USERNAME
  # Always use an access token rather than real password when possible.
  password:
    - KAMAL_REGISTRY_PASSWORD

# HardhatDB, HardhatKV, and HardhatQ are clusters created in the control plane.
# They are not Kamal accessories. Each cluster's client allowlist must include
# this server's public address.
#
# MYSQL_ADDR is a node's public IP and port, such as 203.0.113.10:3306.
# KV_ADDR is the HardhatKV public IP and port, such as 203.0.113.11:6399.
# AMQP_URL is amqps://root:<password>@203.0.113.12:5672.
# The server certificates name those public IPs, so the host must be the IP.
# MYSQL_TLS_CA_PEM and AMQP_TLS_CA_PEM are each cluster's CA. HardhatKV has no TLS.
env:
  secret:
    - MYSQL_ADDR
    - MYSQL_PASSWORD
    - MYSQL_TLS_CA_PEM
    - KV_ADDR
    - KV_PASSWORD
    - AMQP_URL
    - AMQP_TLS_CA_PEM
  clear:
    HTTP_ADDR: ":8080"
    MYSQL_USER: root
    MYSQL_DB: shop

aliases:
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f

builder:
  arch: amd64

# The web process retries each cluster for up to two minutes before it listens.
# The worker command is the argument after the image entrypoint, so the process is `ordersapp worker`.
deploy_timeout: 180
