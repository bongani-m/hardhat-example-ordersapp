services:
  hardhatdb:
    image: ghcr.io/bongani-m/hardhatdb:v0.1.0-alpha.3
    environment:
      HARDHATDB_MYSQL_HOST: 0.0.0.0
      HARDHATDB_BOOTSTRAP_PASSWORD: secret
      HARDHATDB_TLS_CERT: /certs/server.crt
      HARDHATDB_TLS_KEY: /certs/server.key
    ports:
      - "3306:3306"
    volumes:
      - hardhatdb:/data
      - ./certs:/certs:ro

  hardhatkv:
    image: ghcr.io/bongani-m/hardhatkv:v1.3.0-alpha.1
    ports:
      - "6399:6399"
    volumes:
      - hardhatkv:/data

  hardhatq:
    image: ghcr.io/bongani-m/hardhatq:v0.11.0-alpha.1
    ports:
      - "5672:5672"
    volumes:
      - hardhatq:/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: :8080
      MYSQL_ADDR: hardhatdb:3306
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
      MYSQL_DB: shop
      KV_ADDR: hardhatkv:6399
      AMQP_URL: amqp://guest:guest@hardhatq:5672/
      MYSQL_TLS_CA: /certs/ca.crt
    volumes:
      - ./certs:/certs:ro
    depends_on:
      - hardhatdb
      - hardhatkv
      - hardhatq

volumes:
  hardhatdb:
  hardhatkv:
  hardhatq:
