services:
  hardhatdb:
    image: ghcr.io/bongani-m/hardhatdb:latest
    environment:
      HARDHATDB_MYSQL_HOST: 0.0.0.0
      HARDHATDB_BOOTSTRAP_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - hardhatdb:/data

  hardhatkv:
    image: ghcr.io/bongani-m/hardhatkv:latest
    ports:
      - "6399:6399"
    volumes:
      - hardhatkv:/data

  hardhatq:
    image: ghcr.io/bongani-m/hardhatq:latest
    ports:
      - "5672:5672"
    volumes:
      - hardhatq:/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: :8080
      MYSQL_ADDR: hardhatdb:3306
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
      MYSQL_DB: shop
      KV_ADDR: hardhatkv:6399
      AMQP_URL: amqp://guest:guest@hardhatq:5672/
    depends_on:
      - hardhatdb
      - hardhatkv
      - hardhatq

volumes:
  hardhatdb:
  hardhatkv:
  hardhatq:
